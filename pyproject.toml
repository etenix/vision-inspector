[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-inspector"
version = "0.1.0"
description = "A toolkit for inspecting and validating computer vision datasets and annotations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Haoran Sun" }
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[project.scripts]
vision-inspector = "vision_inspector.cli:main"

[tool.setuptools]
packages = ["vision_inspector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
